<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Тест отбора — Премия Михаила Врубеля</title>
  <link rel="stylesheet" href="demo-base.css?v=1">
  <link rel="stylesheet" href="demo-theme.css?v=1">
  <link rel="stylesheet" href="demo.css?v=1">
  <script src="demo.js?v=1" defer></script>
</head>
<body class="dark-gallery pair-active">
  <header class="site-header">
    <a class="brand" href="../../"><span>ПРЕМИЯ</span><strong>Михаила Врубеля</strong></a>
    <span class="pilot-tag">ТЕСТ · 20 РАБОТ</span>
  </header>
  <main>
    <section class="voting">
      <div class="voting-heading"><div><p class="eyebrow">ТЕСТОВЫЙ ОТБОР</p><h1>Какая картина сильнее?</h1></div></div>
      <div class="mobile-prompt">Какая картина сильнее?</div>
      <div class="loading-notice"><span id="load-status" role="status" hidden></span> <button id="retry-images" class="text-button" type="button" hidden>Повторить загрузку</button></div>
      <div id="comparison" class="comparison images-loading">
        <article class="art-card">
          <div class="image-space"><button class="image-choice" id="left-choice" type="button" disabled aria-label="Выбрать левую картину"><img id="left" alt="Левая картина"></button></div>
          <div class="art-meta"><span id="left-num"></span><button class="zoom-button" type="button" disabled data-side="left">Увеличить</button></div>
          <button class="choose-button" type="button" disabled data-choice="left">Выбрать эту картину ←</button>
        </article>
        <div class="or-badge" aria-hidden="true">или</div>
        <article class="art-card">
          <div class="image-space"><button class="image-choice" id="right-choice" type="button" disabled aria-label="Выбрать правую картину"><img id="right" alt="Правая картина"></button></div>
          <div class="art-meta"><span id="right-num"></span><button class="zoom-button" type="button" disabled data-side="right">Увеличить</button></div>
          <button class="choose-button" type="button" disabled data-choice="right">Выбрать эту картину →</button>
        </article>
      </div>
      <div class="voting-footer"><span>Можно выбирать стрелками ← →</span></div>
    </section>
  </main>
  <dialog id="zoom-dialog"><button id="zoom-close" class="close-zoom" type="button" aria-label="Закрыть">×</button><img id="zoom-image" alt="Увеличенная картина"></dialog>
</body>
</html>
